name: Console UI Tests

# Hermetic Playwright + behave tests for the FixFlux Console's three tabs
# (fixflux/tests/ui). No Docker stack: compliance-api runs in-process with
# Kafka, Postgres and the market data WebSocket faked.
on:
  push:
    paths:
      - 'fixflux/tests/ui/**'
      - 'fixflux/services/compliance-service/src/compliance_service/templates/**'
      - 'fixflux/services/compliance-service/src/compliance_service/api/**'
      - 'fixflux/services/compliance-service/src/compliance_service/static/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    paths:
      - 'fixflux/tests/ui/**'
      - 'fixflux/services/compliance-service/src/compliance_service/templates/**'
      - 'fixflux/services/compliance-service/src/compliance_service/api/**'
      - 'fixflux/services/compliance-service/src/compliance_service/static/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write   # dorny/test-reporter publishes the results as a check run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Playwright UI tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fixflux

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            fixflux/shared/pyproject.toml
            fixflux/services/compliance-service/pyproject.toml
            fixflux/tests/ui/requirements.txt

      - name: Install shared, compliance-service and UI test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared
          pip install -e ./services/compliance-service
          pip install -r tests/ui/requirements.txt ruff==0.17.2 black isort

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Lint UI tests
        working-directory: fixflux/tests/ui
        run: |
          python -m ruff check .
          python -m black --check .
          python -m isort --check-only .

      - name: Run UI tests
        working-directory: fixflux/tests/ui
        # JUnit XML (one file per feature) feeds the test report below; the
        # pretty console output from behave.ini is kept alongside it.
        run: python -m behave --junit --junit-directory reports/

      # Same reporter as the e2e workflow, but pinned to the v1.9.1 release
      # commit: the floating v1 tag tracks unreleased commits on main.
      - name: Publish UI test report
        if: success() || failure()
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5  # v1.9.1
        with:
          name: Console UI Tests (Playwright + behave)
          path: fixflux/tests/ui/reports/*.xml
          reporter: java-junit
          # The run step already fails the job on a failed scenario; and if
          # linting failed first there are no reports, which isn't an error.
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Playwright traces of failed scenarios
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-traces
          path: fixflux/tests/ui/artifacts/
          if-no-files-found: ignore
