name: FIX Replay CI

on:
  push:
    paths:
      - 'fixflux/clients/fix-replay/**'
      - 'fixflux/shared/**'
      - '.github/workflows/fix-replay.yml'
  pull_request:
    paths:
      - 'fixflux/clients/fix-replay/**'
      - 'fixflux/shared/**'
      - '.github/workflows/fix-replay.yml'
  workflow_dispatch: # allow manual runs from the Actions tab
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC

# Restrict the default GITHUB_TOKEN to read-only.
permissions:
  contents: read

# Cancel any in-progress run for the same workflow + branch when a new push
# arrives, avoiding redundant work.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    # All `run:` steps default to the project root unless overridden per-step.
    defaults:
      run:
        working-directory: fixflux

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # ── 2. Python runtime ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            fixflux/shared/pyproject.toml
            fixflux/clients/fix-replay/pyproject.toml

      # ── 3. Shared platform library ────────────────────────────────────────────
      - name: Install shared module
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared

      # ── 4. Tool + test tools ──────────────────────────────────────────────────
      - name: Install fix-replay and test tools
        working-directory: fixflux/clients/fix-replay
        run: |
          pip install -e .
          pip install pytest pytest-cov ruff==0.17.2 black isort mypy

      # ── 5. Unit tests with coverage ───────────────────────────────────────────
      - name: Run pytest with coverage
        working-directory: fixflux/clients/fix-replay
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      # ── 5b. Lint ──────────────────────────────────────────────────────────────
      - name: Lint (ruff, black, isort, mypy)
        working-directory: fixflux/clients/fix-replay
        run: |
          python -m ruff check .
          python -m black --check .
          python -m isort --check-only .
          python -m mypy src/

      # ── 6. Docker image ───────────────────────────────────────────────────────
      # Build context is fixflux/ so the Dockerfile can COPY shared/.
      - name: Build Docker image
        run: |
          docker build \
            --file clients/fix-replay/Dockerfile \
            --tag fix-replay:latest \
            .
