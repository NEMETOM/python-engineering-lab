name: Fix Injector CI

on:
  push:
    paths:
      - 'fixflux/services/fix-injector/**'
      - 'fixflux/shared/**'
      - '.github/workflows/fix-injector.yml'
  pull_request:
    paths:
      - 'fixflux/services/fix-injector/**'
      - 'fixflux/shared/**'
      - '.github/workflows/fix-injector.yml'
  workflow_dispatch: # allow manual runs from the Actions tab

# Restrict the default GITHUB_TOKEN to read-only; grant extra scopes explicitly
# in the steps that need them (e.g. packages: write for a registry push).
permissions:
  contents: read

# Cancel any in-progress run for the same workflow + branch when a new push
# arrives, avoiding redundant work and stale deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    # All `run:` steps default to the project root unless overridden per-step.
    defaults:
      run:
        working-directory: fixflux

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # ── 2. Python runtime ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          # Cache pip's download cache keyed on both dependency manifests.
          cache: pip
          cache-dependency-path: |
            fixflux/shared/pyproject.toml
            fixflux/services/fix-injector/pyproject.toml

      # ── 3. Shared platform library ────────────────────────────────────────────
      # Must be installed before the service because the service imports from it.
      - name: Install shared module
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared

      # ── 4. Service + test tools ───────────────────────────────────────────────
      - name: Install service and test tools
        working-directory: fixflux/services/fix-injector
        run: |
          pip install -e .
          pip install pytest pytest-cov ruff black isort mypy httpx

      # ── 5. Unit tests with coverage ───────────────────────────────────────────
      - name: Run pytest with coverage
        working-directory: fixflux/services/fix-injector
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      # ── 5b. Lint ────────────────────────────────────────────
      - name: Lint (ruff, black, isort, mypy)
        working-directory: fixflux/services/fix-injector
        run: |
          python -m ruff check .
          python -m black --check .
          python -m isort --check-only .
          python -m mypy src/

      # ── 6. Docker image ───────────────────────────────────────────────────────
      # Build context is fixflux/ so the Dockerfile can
      # COPY shared/ alongside the service source.
      - name: Build Docker image
        run: |
          docker build \
            --file services/fix-injector/Dockerfile \
            --tag fix-injector:latest \
            .
