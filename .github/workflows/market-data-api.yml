name: Market Data API CI

on:
  push:
    paths:
      - 'fixflux/services/market-data-api/**'
      - 'fixflux/shared/**'
      - '.github/workflows/market-data-api.yml'
  pull_request:
    paths:
      - 'fixflux/services/market-data-api/**'
      - 'fixflux/shared/**'
      - '.github/workflows/market-data-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fixflux

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            fixflux/shared/pyproject.toml
            fixflux/services/market-data-api/pyproject.toml

      - name: Install shared module
        run: |
          python -m pip install --upgrade pip
          pip install -e ./shared

      - name: Install service and test tools
        working-directory: fixflux/services/market-data-api
        run: |
          pip install -e ".[test]"
          pip install ruff black isort mypy

      - name: Run pytest with coverage
        working-directory: fixflux/services/market-data-api
        run: |
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            -v

      - name: Lint (ruff, black, isort, mypy)
        working-directory: fixflux/services/market-data-api
        run: |
          python -m ruff check .
          python -m black --check .
          python -m isort --check-only .
          python -m mypy src/

      - name: Build Docker image
        run: |
          docker build \
            --file services/market-data-api/Dockerfile \
            --tag market-data-api:latest \
            .
