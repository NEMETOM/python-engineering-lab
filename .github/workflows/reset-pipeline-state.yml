name: FIXFlux - Reset Pipeline State

# Manual-only: restarts matching-engine and/or risk-service on the Droplet to
# clear their in-memory state (matching-engine's resting order book,
# risk-service's last-traded-price map and open-order counts). Neither is
# touched by the weekly cleanup job, which only prunes Postgres rows and
# Kafka topics - this is the only way to get a clean book/reference prices
# without a full redeploy.
#
# With wipe_data ticked it's a full fresh start for a demo: it first empties
# every demo-data table (trades, compliance, MiFID II reports), then restarts.

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated docker compose service names to restart'
        required: false
        default: 'matching-engine risk-service'
      wipe_data:
        description: 'Also DELETE ALL trades, compliance data and MiFID II reports (fresh start)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  reset:
    name: Restart stateful services on Droplet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/fixflux_do
          chmod 600 ~/.ssh/fixflux_do
          ssh-keyscan -H ${{ secrets.DO_DROPLET_IP }} >> ~/.ssh/known_hosts

      # Same tables as scripts/clear_db.py. compliance_rule_overrides is kept:
      # it's rule configuration, not demo data. TRUNCATE leaves the views and
      # reader roles on regulatory_reports in place.
      - name: Wipe demo data
        if: ${{ inputs.wipe_data }}
        run: |
          ssh -i ~/.ssh/fixflux_do -o ConnectTimeout=10 root@${{ secrets.DO_DROPLET_IP }} "
            cd ~/python-engineering-lab/fixflux
            docker compose exec -T postgres psql -U fixuser -d fixdb -v ON_ERROR_STOP=1 -c '
              TRUNCATE TABLE trades, compliance_violations, client_risk_scores,
                compliance_audit_trail, regulatory_reports RESTART IDENTITY CASCADE;'
            docker compose exec -T postgres psql -U fixuser -d fixdb -t -c '
              SELECT (SELECT count(*) FROM trades) AS trades,
                     (SELECT count(*) FROM compliance_violations) AS violations,
                     (SELECT count(*) FROM regulatory_reports) AS reports;'
          "

      - name: Restart requested services
        run: |
          ssh -i ~/.ssh/fixflux_do -o ConnectTimeout=10 root@${{ secrets.DO_DROPLET_IP }} "
            cd ~/python-engineering-lab/fixflux
            docker compose restart ${{ github.event.inputs.services }}
            docker compose ps ${{ github.event.inputs.services }}
          "

      - name: Verify services came back up
        run: |
          ssh -i ~/.ssh/fixflux_do -o ConnectTimeout=10 root@${{ secrets.DO_DROPLET_IP }} "
            cd ~/python-engineering-lab/fixflux
            for svc in ${{ github.event.inputs.services }}; do
              status=\$(docker compose ps --status running --quiet \"\$svc\" | wc -l)
              if [ \"\$status\" -eq 0 ]; then
                echo \"::error::\$svc did not come back up\"
                docker compose logs --tail=50 \"\$svc\"
                exit 1
              fi
              echo \"\$svc is running\"
            done
          "
