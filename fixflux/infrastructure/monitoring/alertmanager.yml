route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning

receivers:
  # Every receiver below is a structural placeholder: the routing tree (by
  # severity label) is real and will group/dedupe alerts correctly, but none
  # of these actually notify anyone yet. No Slack webhook, email SMTP config,
  # or PagerDuty key exists in this repo - don't invent one. Fired alerts are
  # always visible at http://localhost:9093 regardless; add a real
  # `slack_configs:` / `email_configs:` / `pagerduty_configs:` block to
  # `critical` and `warning` below once real notification credentials exist.
  - name: default
  - name: critical
  - name: warning
