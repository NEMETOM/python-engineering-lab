[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-api"
version = "0.1.0"
description = "WebSocket streaming API for FixFlux market data snapshots"
requires-python = ">=3.11"

dependencies = [
    "kafka-python",
    "pydantic",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["market_data_api", "shared"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["market_data_api", "shared"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pyright]
extraPaths = ["../../"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
