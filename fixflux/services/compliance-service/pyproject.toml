[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-service"
version = "0.1.0"
description = "Compliance and surveillance module for FIX Protocol Simulator Pro"
requires-python = ">=3.11"

dependencies = [
    "kafka-python",
    "pydantic",
    "sqlalchemy",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "prometheus-client>=0.20",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "httpx",
    "behave",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compliance_service = ["templates/*.html", "static/*.png"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["compliance_service", "shared"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling Depends()/Query() etc. as an argument
# default; B008 doesn't special-case this the way it does for e.g. dataclasses.
extend-immutable-calls = ["fastapi.Depends"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["compliance_service", "shared"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
