<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compliance Rules Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="px-6 py-4 border-b border-slate-800">
    <h1 class="text-lg font-semibold">Compliance &amp; Surveillance Rules</h1>
    <p class="text-sm text-slate-400">
      Toggling here updates <code class="text-emerald-400">compliance_rule_overrides</code> in Postgres.
      compliance-consumer picks up changes within a few seconds - it's a live control, not a preview.
    </p>
  </header>

  <main class="p-6 space-y-8 max-w-4xl mx-auto">
    <section>
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400 mb-3">Compliance</h2>
      <div id="grid-compliance" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>
    <section>
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400 mb-3">Surveillance</h2>
      <div id="grid-surveillance" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>
  </main>

  <script id="rules-data" type="application/json">{{ rules | tojson }}</script>
  <script>
    const rules = JSON.parse(document.getElementById("rules-data").textContent);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function cardHtml(rule) {
      const badge = rule.enabled
        ? '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400">Active</span>'
        : '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-slate-700 text-slate-400">Disabled</span>';
      const overrideNote = rule.overridden
        ? '<span class="text-xs text-amber-400">manually overridden</span>'
        : '<span class="text-xs text-slate-600">using policy default</span>';
      return `
        <div class="flex items-center justify-between rounded-lg border border-slate-700 bg-slate-900 px-4 py-3">
          <div>
            <div class="font-medium">${escapeHtml(rule.label)}</div>
            <div class="flex items-center gap-2 mt-1">${badge}${overrideNote}</div>
          </div>
          <button
            type="button"
            role="switch"
            aria-checked="${rule.enabled}"
            data-rule-id="${escapeHtml(rule.rule_id)}"
            class="toggle relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${rule.enabled ? "bg-emerald-600" : "bg-slate-700"}"
          >
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${rule.enabled ? "translate-x-6" : "translate-x-1"}"></span>
          </button>
        </div>
      `;
    }

    function render() {
      document.getElementById("grid-compliance").innerHTML = rules
        .filter((r) => r.category === "compliance")
        .map(cardHtml)
        .join("");
      document.getElementById("grid-surveillance").innerHTML = rules
        .filter((r) => r.category === "surveillance")
        .map(cardHtml)
        .join("");

      document.querySelectorAll(".toggle").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const ruleId = btn.dataset.ruleId;
          const rule = rules.find((r) => r.rule_id === ruleId);
          const nextEnabled = !rule.enabled;

          btn.disabled = true;
          try {
            const resp = await fetch("/api/compliance/toggle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ rule_id: ruleId, enabled: nextEnabled }),
            });
            if (!resp.ok) {
              throw new Error(`HTTP ${resp.status}`);
            }
            rule.enabled = nextEnabled;
            rule.overridden = true;
            render();
          } catch (err) {
            alert(`Failed to toggle ${rule.label}: ${err}`);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
