<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}FixFlux Console{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">
  <header class="border-b border-slate-800">
    <div class="px-6 pt-3 flex items-center gap-3">
      <img src="/static/fixflux-logo.png" alt="FixFlux" class="h-8 w-8" />
      <span class="font-semibold text-slate-200">FixFlux Console</span>
    </div>
    <nav class="px-6 mt-2 flex gap-1">
      <a
        href="/"
        class="px-4 py-2 text-sm border-b-2 {{ 'border-emerald-500 text-emerald-400' if active_tab == 'injector' else 'border-transparent text-slate-400 hover:text-slate-200' }}"
      >Fix Msg Injector</a>
      <a
        href="/admin/compliance"
        class="px-4 py-2 text-sm border-b-2 {{ 'border-emerald-500 text-emerald-400' if active_tab == 'compliance' else 'border-transparent text-slate-400 hover:text-slate-200' }}"
      >Compliance Rules</a>
    </nav>
  </header>

  <div class="flex-1 min-h-0 overflow-y-auto flex flex-col">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
