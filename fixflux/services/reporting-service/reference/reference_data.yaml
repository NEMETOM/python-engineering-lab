instruments:
  # mifid_in_scope and the CFI codes are simulator assumptions for illustration,
  # not a legal classification of these instruments. CFI codes are 6 characters
  # per ISO 10962 (RTS 22 Annex I Table 1); only in-scope instruments need one.
  AAPL:
    asset_class: EQUITY
    cfi_code: ESVUFR
    currency: USD
    mifid_in_scope: true
  MSFT:
    asset_class: EQUITY
    cfi_code: ESVUFR
    currency: USD
    mifid_in_scope: true
  EURUSD:
    asset_class: FX_SPOT
    currency: USD
    mifid_in_scope: false
    out_of_scope_reason: FX spot is treated as outside MiFID II transparency in this simulator
  GBPUSD:
    asset_class: FX_SPOT
    currency: USD
    mifid_in_scope: false
    out_of_scope_reason: FX spot is treated as outside MiFID II transparency in this simulator
  BTCUSD:
    asset_class: CRYPTO
    currency: USD
    mifid_in_scope: false
    out_of_scope_reason: crypto-assets are treated as outside MiFID II transparency in this simulator
  ETHUSD:
    asset_class: CRYPTO
    currency: USD
    mifid_in_scope: false
    out_of_scope_reason: crypto-assets are treated as outside MiFID II transparency in this simulator
