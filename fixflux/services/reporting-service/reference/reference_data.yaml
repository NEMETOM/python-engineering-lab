# Reference data for reporting-service: who the counterparties are (LEI, trading
# capacity) and what each instrument is (CFI code, MiFID II scope).
#
# EVERY LEI BELOW IS SYNTHETIC. Generated deterministically from the client ID
# with a "SIMX00" prefix and valid ISO 7064 MOD 97-10 check digits, so they pass
# format validation but identify no real entity. Never replace them with real
# LEIs scraped from GLEIF for demo purposes.
#
# Clients not listed here (e.g. the VOL_B####/VOL_S#### volume-test clients)
# produce INCOMPLETE reports by design - missing reference data is surfaced,
# never defaulted.

participants:
  # trading_capacity per RTS 22 field 29: DEAL | MTCH | AOTC. Every simulator
  # participant trades for its own account, hence DEAL throughout.
