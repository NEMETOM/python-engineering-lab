[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reporting-service"
version = "0.1.0"

dependencies = [
 "kafka-python==3.0.12",
 "pydantic",
 "sqlalchemy",
 "psycopg2-binary",
 "pyyaml",
 "prometheus-client>=0.20",
 "fastapi",
 "uvicorn",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "behave",
  "httpx",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["reporting_service", "shared"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling Depends()/Query() as an argument
# default; B008 doesn't special-case this the way it does for e.g. dataclasses.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["reporting_service", "shared"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests/unit"]
